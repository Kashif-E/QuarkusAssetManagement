# ======================================================
# Enterprise Asset Management System Configuration
# ======================================================

# ------------------------------------------------------
# Application Configuration
# ------------------------------------------------------
# Basic information about the application
quarkus.application.name=enterprise-asset-management-system
quarkus.application.version=1.0.0-SNAPSHOT

# ------------------------------------------------------
# HTTP Configuration
# ------------------------------------------------------
# Settings for the HTTP server
quarkus.http.port=8080
quarkus.http.cors=true

# ------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------
# Console logging settings
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO

# Application package-specific logging
quarkus.log.category."solutions.dreamforge".level=DEBUG

# ------------------------------------------------------
# Database Configuration (PostgreSQL)
# ------------------------------------------------------
# Database connection is disabled for now during initial development
# Comment out this line when you want to re-enable the database
quarkus.datasource.jdbc=false

# PostgreSQL configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.oidc.enabled=false

# Reactive and JDBC URLs
quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/eams
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/eams
quarkus.datasource.jdbc.max-size=16

# ------------------------------------------------------
# Hibernate ORM Configuration
# ------------------------------------------------------
# Database schema generation strategy
# "update" - updates the schema, creating new tables if necessary
quarkus.hibernate-orm.database.generation=update

# SQL logging for debugging
quarkus.hibernate-orm.log.sql=true

# SQL script to load sample data in development mode
%dev.quarkus.hibernate-orm.sql-load-script=import-dev.sql

# ------------------------------------------------------
# Development Mode Configuration
# ------------------------------------------------------
# Enable instrumentation for development mode
%dev.quarkus.live-reload.instrumentation=true
